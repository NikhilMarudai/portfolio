<style>
:root{--paper:#f5f1e8;--paper-deep:#ece6d8;--ink:#1e1a14;--ink-soft:#5c5344;--brick:#b8442c;
  --moss:#4a5d3a;--gold:#c8992e;--card:#fdfbf6;--line:#d8d0bf}
html,body{margin:0;height:100%;font-family:'Archivo',sans-serif}
#map{position:absolute;inset:0;background:var(--paper)}
.bar{position:absolute;top:10px;left:52px;right:10px;z-index:1000;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ttl{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:15px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);padding:3px 12px 4px;border-radius:999px;margin-right:4px}
.chip{font-family:'Archivo';font-size:.72rem;font-weight:500;padding:.34rem .8rem;border-radius:999px;
  border:1px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;transition:all .18s ease}
.chip:hover{background:var(--paper-deep)}
.chip.on{background:var(--ink);color:var(--paper)}
.lg{position:absolute;bottom:4px;left:6px;z-index:1000;font-family:'Spline Sans Mono',monospace;
  font-size:9.5px;color:var(--ink-soft);background:rgba(253,251,246,.92);border:1px solid var(--line);
  padding:3px 8px;border-radius:8px;max-width:78%}
.site-ico{font-size:15px;line-height:1;filter:drop-shadow(0 1px 1px rgba(30,26,20,.35))}
.leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;font-family:'Archivo';box-shadow:0 8px 24px -8px rgba(30,26,20,.25)}
.leaflet-popup-content{font-size:12.5px;line-height:1.5;margin:10px 14px}
.leaflet-popup-content .src{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--ink-soft)}
.leaflet-popup-tip{background:var(--card)}
</style></head><body>

const map = L.map('map', {scrollWheelZoom: false, zoomControl: true}).setView([37.762, -122.435], 12);
L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
  {maxZoom: 18, attribution: '&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
const ord = n => { const s=["th","st","nd","rd"], v=Math.round(n)%100; return Math.round(n)+(s[(v-20)%10]||s[v]||s[0]); };
/* icons derive from the site's name, same rule as the dashboard */
function hazardIcon(name){ const n=name.toLowerCase();
  if(/superfund|shipyard|radiolog/.test(n)) return '☢️';
  if(/power plant|pg&e/.test(n)) return '⚡';
  if(/wastewater|sewage|odor/.test(n)) return '💨';
  if(/industrial/.test(n)) return '🏭';
  if(/flood|lowland|slough|wetland|fill|candlestick/.test(n)) return '🌊';
  return '⚠️'; }
function anchorIcon(name){ const n=name.toLowerCase();
  if(/anthropic|openai|deepmind|ai/.test(n)) return '🤖';
  if(/caltrain|bart|station|transit|muni/.test(n)) return '🚆';
  if(/combinator|yc/.test(n)) return '🚀';
  return '💼'; }
const ico = (lat,lng,emoji,title) => L.marker([lat,lng],
  {icon: L.divIcon({className:'', html:`<span class="site-ico" title="${title}">${emoji}</span>`, iconSize:[26,26], iconAnchor:[13,13]})});
/* SF-relative quintile ramp: moss = cleanest fifth of SF, brick = worst */
const ramp = r => r==null?'transparent': r>=80?'#b8442c': r>=60?'#cf6b3a': r>=40?'#c8992e': r>=20?'#8a9451':'#4a5d3a';
function tractLayer(rk, raw, label, unit){
  return L.geoJSON(D.tracts, {style: f => {const r=f.properties[rk];
      return {weight:.5, color:'#a99e88', fillColor: ramp(r), fillOpacity: r==null?0:.45};},
    onEachFeature: (f,l) => { const p=f.properties, r=p[rk], sw=p[rk.replace('R','')];
      l.bindPopup(`<b>Tract ${p.t}</b><br>${label}: ${r==null?'no data':ord(r)+' of SF tracts'}`
        + (sw!=null?`<br>${ord(sw)} pctl statewide`:'')
        + (raw && p[raw]!=null?`<br>${p[raw]} ${unit}`:'')
        + `<br><span class="src">CalEnviroScreen 4.0 (OEHHA)</span>`); }});
}
function hazLayer(){
  const g = L.layerGroup();
  D.zones.forEach(z => { const e=hazardIcon(z.name);
    L.circle([z.lat,z.lng], {radius: z.r*1609.34, color: z.level==='high'?'#b8442c':'#c8992e',
      weight:1.4, dashArray:'4 4', fillColor: z.level==='high'?'#b8442c':'#c8992e', fillOpacity:.09})
      .bindPopup(`${e} <b>${z.name}</b><br><span class="src">curated radius from EPA/DTSC records, not a regulatory boundary</span>`).addTo(g);
    ico(z.lat,z.lng,e,z.name).addTo(g); });
  D.tri.forEach(t => ico(t.lat,t.lng,'🏭',t.name)
    .bindPopup(`🏭 <b>EPA TRI registry:</b> ${t.name}<br><span class="src">Toxics Release Inventory; includes historical reporters</span>`).addTo(g));
  D.superfund.forEach(s => ico(s.lat,s.lng,'☢️',s.name)
    .bindPopup(`☢️ <b>Superfund:</b> ${s.name}<br><span class="src">${s.status}</span>`).addTo(g));
  return g;
}
function marksLayer(){
  const g = L.layerGroup();
  D.marks.forEach(m => ico(m.lat,m.lng,anchorIcon(m.name),m.name).bindPopup(`${anchorIcon(m.name)} ${m.name}`).addTo(g));
  return g;
}
const LEG = {
  base: '☢️ Superfund · 🏭 TRI facility · ⚡💨🌊 hazard radius (icon = what it is) · CalEnviroScreen 4.0 · EPA TRI &amp; NPL · © CARTO/OSM',
  air: 'PM2.5, shaded relative to SF: 🟢 moss = cleanest fifth of the city, 🔴 brick = worst fifth · click a tract for numbers · CES 4.0',
  water: 'Drinking-water contaminant index, shaded relative to SF: moss = cleanest fifth, brick = worst · tap water itself is one citywide SFPUC system · CES 4.0'};
const layers = {air: null, water: null, haz: hazLayer().addTo(map), marks: marksLayer().addTo(map)};
const build = {air: () => tractLayer('pmR','pmv','PM2.5','µg/m³ (2015-17 avg)'),
               water: () => tractLayer('drR',null,'Drinking-water index',''),
               haz: hazLayer, marks: marksLayer};
function legend(){ document.getElementById('legend').innerHTML = layers.air?LEG.air:layers.water?LEG.water:LEG.base; }
[['air','cAir'],['water','cWater'],['haz','cHaz'],['marks','cMarks']].forEach(([n,id]) => {
  document.getElementById(id).onclick = e => {
    const on = !layers[n];
    if (n==='air' && on && layers.water) { map.removeLayer(layers.water); layers.water=null; document.getElementById('cWater').classList.remove('on'); }
    if (n==='water' && on && layers.air) { map.removeLayer(layers.air); layers.air=null; document.getElementById('cAir').classList.remove('on'); }
    if (on) { layers[n] = build[n]().addTo(map); e.target.classList.add('on'); }
    else { map.removeLayer(layers[n]); layers[n]=null; e.target.classList.remove('on'); }
    legend();
  };
});
