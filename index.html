function band(){
  const t = D.totals, w = D.wispr;
  const tiles = [
    [t.months + " mo", "building", "since " + t.since],
    [nf(t.active_days), "days shipping code", "out of " + t.span_days + " · ~7 in 10"],
    [nf(t.commits), "git commits", "across " + t.count + " projects"],
    ["~" + nf(t.lines), "lines of source", ""],
    [nf(w.words), "words dictated", "via Wispr Flow · desktop + mobile"],
  ];
  document.getElementById("band").innerHTML = tiles.map(t =>
    `<div class="sig"><div class="n${t[3]?' set':''}">${t[0]}</div>`+
    `<div class="l"><b>${t[1]}</b><br>${t[2]||""}</div></div>`).join("");
}

// ---- area chart (single series, time x) ----
function chart(rootId, heroId, idx, color){
  const pts = D.timeline.points;            // [ts, commits, lines]
  if(!pts.length) return;
  document.getElementById(heroId).textContent = nf(pts[pts.length-1][idx]);
  document.getElementById(heroId).style.color = color;
  const W=340,H=150,pl=6,pr=10,pt=12,pb=18;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[idx]);
  const x0=xs[0],x1=xs[xs.length-1],ymax=Math.max(...ys,1);
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr);
  const Y=v=>H-pb-(v/ymax)*(H-pt-pb);
  let line=`M${X(xs[0]).toFixed(1)},${Y(ys[0]).toFixed(1)}`;
  pts.forEach(p=>line+=`L${X(p[0]).toFixed(1)},${Y(p[idx]).toFixed(1)}`);
  const area=line+`L${X(x1).toFixed(1)},${H-pb}L${X(x0).toFixed(1)},${H-pb}Z`;
  // month gridlines
  let ticks="";const seen=new Set();
  pts.forEach(p=>{const d=new Date(p[0]*1000);const key=d.getFullYear()+"-"+d.getMonth();
    if(!seen.has(key)&&d.getDate()<=9){seen.add(key);const xx=X(p[0]).toFixed(1);
      ticks+=`<line x1="${xx}" y1="${pt}" x2="${xx}" y2="${H-pb}" stroke="${css('--grid')}" stroke-width="1"/>`+
             `<text x="${xx}" y="${H-6}" class="ax" text-anchor="middle">${d.toLocaleString('en',{month:'short'})}</text>`;}});
  const svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
    ${ticks}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(x1).toFixed(1)}" cy="${Y(ys[ys.length-1]).toFixed(1)}" r="3" fill="${color}"/>
    <line id="cx" x1="0" y1="${pt}" x2="0" y2="${H-pb}" stroke="${color}" stroke-width="1" opacity="0"/>
    <rect id="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;
  const root=document.getElementById(rootId);
  root.insertAdjacentHTML("beforeend", svg);
  const tip=document.createElement("div");tip.className="tip";root.appendChild(tip);
  const el=root.querySelector("svg"), hit=root.querySelector("#hit"), cx=root.querySelector("#cx");
  hit.addEventListener("mousemove",e=>{
    const r=el.getBoundingClientRect();
    const t=x0+((e.clientX-r.left)/r.width)*(x1-x0);
    let best=pts[0];for(const p of pts) if(Math.abs(p[0]-t)<Math.abs(best[0]-t)) best=p;
    const px=(X(best[0])/W)*r.width, py=(Y(best[idx])/H)*r.height;
    cx.setAttribute("x1",X(best[0]));cx.setAttribute("x2",X(best[0]));cx.setAttribute("opacity","0.5");
    tip.style.opacity="1";tip.style.left=px+"px";tip.style.top=py+"px";
    tip.textContent=`${new Date(best[0]*1000).toLocaleDateString('en',{month:'short',day:'numeric'})} · ${nf(best[idx])}`;
  });
  hit.addEventListener("mouseleave",()=>{tip.style.opacity="0";cx.setAttribute("opacity","0");});
}

function rows(list){
  const vis = list.filter(p => !D.flagship_ids.includes(p.id));
  document.getElementById("others").innerHTML = vis.map(p=>{
    const meta = [
      `<span class="dot d-${p.status}"></span>${p.status_label}`,
      p.commits ? `${nf(p.commits)} commits` : "",
      p.lines ? `${nf(p.lines)} lines` : "",
      p.since !== "—" ? p.since : ""
    ].filter(Boolean).join(" · ");
    let thumb = "";
    if(p.images && p.images.length > 1){
      thumb = `<div class="othumb oslide">`+
        p.images.map((s,i)=>`<img src="${s}" class="${i===0?'on':''}" alt="${p.name}">`).join("")+
        `<button class="onav oprev" aria-label="previous">‹</button><button class="onav onext" aria-label="next">›</button>`+
        `<div class="odots">`+p.images.map((s,i)=>`<i class="${i===0?'on':''}"></i>`).join("")+`</div></div>`;
    } else if(p.images && p.images.length === 1){
      thumb = `<a class="othumb" href="${p.images[0]}" target="_blank" rel="noopener"><img src="${p.images[0]}" alt="${p.name}"></a>`;
    } else if(p.video){
      thumb = `<a class="othumb" href="https://youtu.be/${p.video}" target="_blank" rel="noopener"><img src="https://img.youtube.com/vi/${p.video}/hqdefault.jpg" alt="${p.name} demo"><span class="play">▶</span></a>`;
    }
    return `<div class="ocard"><div class="ocard-main">
        <div class="ohead"><span class="oname">${p.name}</span><span class="ometa">${meta}</span></div>
        <div class="odesc">${p.summary||""}</div>
      </div>${thumb}</div>`;
  }).join("");
  document.getElementById("ocount").textContent = `${vis.length} other projects`;
  wireSlides();
}

function wireSlides(){
  document.querySelectorAll(".oslide").forEach(sl=>{
    const imgs=[...sl.querySelectorAll("img")], dots=[...sl.querySelectorAll(".odots i")];
    let i=0, t;
    const show=n=>{i=(n+imgs.length)%imgs.length;
      imgs.forEach((im,k)=>im.classList.toggle("on",k===i));
      dots.forEach((d,k)=>d.classList.toggle("on",k===i));};
    const play=()=>{t=setInterval(()=>show(i+1),3500);};
    sl.querySelector(".oprev").onclick=e=>{e.preventDefault();show(i-1);};
    sl.querySelector(".onext").onclick=e=>{e.preventDefault();show(i+1);};
    dots.forEach((d,k)=>d.onclick=e=>{e.preventDefault();show(k);});
    sl.onmouseenter=()=>clearInterval(t); sl.onmouseleave=play;
    play();
  });
}

document.getElementById("q").oninput = e=>{
  const q=e.target.value.toLowerCase().trim();
  rows(D.projects.filter(p=>!q || (p.name+" "+p.summary).toLowerCase().includes(q)));
